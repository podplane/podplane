# Docker Compose file used by floci.sh

services:
  floci:
    image: docker.io/floci/floci:2.4.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_HOSTNAME: localhost
      FLOCI_SERVICES_EC2_MOCK: "true"
      FLOCI_SERVICES_UI_ENABLED: "false"
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - data:/app/data

volumes:
  data:
